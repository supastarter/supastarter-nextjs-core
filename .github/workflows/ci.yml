name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Ensure no tracked files changed
        run: git diff --exit-code

  web:
    name: Web build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs only the web app and the packages it uses.
      - run: pnpm install --frozen-lockfile --filter "web..."
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web build
      - run: pnpm --filter web test:e2e
      - name: Ensure no tracked files changed
        run: test -z "$(git status --porcelain)" || (git status --porcelain && exit 1)
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Delete this job together with apps/mobile.
  mobile:
    name: Mobile bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Installs only the mobile app and the packages it uses.
      - run: pnpm install --frozen-lockfile --filter "mobile..."
      - run: pnpm --filter mobile build
      - name: Ensure no tracked files changed
        run: test -z "$(git status --porcelain)" || (git status --porcelain && exit 1)
